# CuCoDistill — conda environment (mirrors requirements.txt; stack of paper App. B.4)
#   conda env create -f environment.yml && conda activate cucodistill
# Finalize exact builds with:  conda env export --no-builds > environment.yml
name: cucodistill
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  # --- core (required) ---
  - pytorch>=2.0
  - pytorch-cuda=12.1      # drop this line for a CPU-only environment
  - numpy>=1.23
  - scipy>=1.10
  - pip
  # --- official baselines (optional; DHG + its deps). Without them the
  #     package falls back to the in-repo reference baselines automatically. ---
  - pip:
      - dhg>=0.9.5
      - optuna
      - scikit-learn
